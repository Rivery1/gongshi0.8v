<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>攻势 · 对数学公式发起攻势</title>
<style>
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; }
  body {
    background: linear-gradient(180deg, #EFE8FF 0%, #F7F4FF 320px, #F4F0FF 100%);
    color: #1B1533;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", Arial, sans-serif;
    font-size: 16px;
    line-height: 1.6;
  }
  #app { max-width: 480px; margin: 0 auto; min-height: 100vh; background: #fff; padding-bottom: 40px;
         box-shadow: 0 0 60px rgba(108, 77, 255, .10); }
  .screen { padding: 28px 20px; }
  #home { display: flex; flex-direction: column; min-height: 100vh; box-sizing: border-box; }
  .hidden { display: none !important; }

  h1 { font-size: 26px; margin: 0; }
  .tagline { font-size: 12px; letter-spacing: .04em; color: #7A7396; margin-bottom: 10px; }
  .ask { color: #7A7396; font-size: 14px; margin: 14px 0 18px; }
  .qname { font-size: 25px; line-height: 1.4; margin: 6px 0 4px; }

  button { font-family: inherit; font-size: 16px; border: 0; cursor: pointer; }
  .primary {
    display: block; width: 100%; padding: 15px; border-radius: 14px; margin-top: 18px;
    background: linear-gradient(135deg, #8B6BFF 0%, #6C4DFF 55%, #5B3BE8 100%);
    color: #fff; font-weight: 600; font-size: 17px; letter-spacing: .02em;
    box-shadow: 0 8px 22px rgba(108, 77, 255, .34);
  }
  .primary:active { transform: translateY(1px); }
  .primary[disabled] { background: #DAD2F3; box-shadow: none; }
  .ghost { background: transparent; color: #7A7396; font-size: 14px; padding: 6px 4px; }

  /* ---------- 首页 ---------- */
  .brand { font-size: 30px; font-weight: 800; letter-spacing: .02em; }
  .brand span { color: #6C4DFF; }
  .sub { color: #7A7396; font-size: 14px; margin: 6px 0 22px; }
  .exam-row { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 22px; }
  .chip {
    flex: 1 1 0; min-width: calc(25% - 8px); padding: 9px 0; border-radius: 12px; background: #fff;
    color: #6b7089; font-size: 14px; font-weight: 600; border: 1.5px solid transparent;
  }
  .chip { border: 1.5px solid #EDE6FC; }
  .chip.on { background: #EFE9FF; color: #6C4DFF; border-color: #6C4DFF; box-shadow: 0 4px 12px rgba(108,77,255,.18); }
  .stats { display: flex; gap: 10px; }
  .stats > div {
    flex: 1; background: #fff; border: 1.5px solid #EDE6FC; border-radius: 16px;
    padding: 14px 10px; text-align: center;
  }
  .stats b { display: block; font-size: 24px; color: #1B1533; }
  .stats span { font-size: 12px; color: #7A7396; }
  .hint { text-align: center; color: #A79CC9; font-size: 12px; margin-top: 18px; }

  /* ---------- 学习页 ---------- */
  .topbar { display: flex; align-items: center; gap: 10px; padding: 4px 0 18px; }
  .bar { flex: 1; height: 6px; background: #EDE6FC; border-radius: 6px; overflow: hidden; }
  .bar i { display: block; height: 100%; width: 0; background: #6C4DFF; transition: width .25s; }
  .counter { font-size: 12px; color: #7A7396; min-width: 40px; text-align: right; }

  /* ---------- 公式 ---------- */
  .formula {
    font-family: Georgia, "Times New Roman", "Songti SC", serif;
    font-size: 22px; line-height: 2.1; text-align: center;
    padding: 20px 10px; overflow-x: auto; margin: 6px 0 4px;
    background: #F7F4FF; border-radius: 16px; word-break: break-word;
  }
  .formula i { font-style: italic; }
  .formula sup, .formula sub { font-size: 68%; }
  .cond { display: block; font-size: 13px; color: #7A7396; margin-top: 6px; font-family: inherit; }
  .frac { display: inline-block; vertical-align: middle; text-align: center; margin: 0 .18em; }
  .frac .num { display: block; border-bottom: 1.2px solid currentColor; padding: 0 .22em; line-height: 1.5; }
  .frac .den { display: block; padding: 0 .22em; line-height: 1.5; }
  .sqrt .rad { border-top: 1.2px solid currentColor; padding: 0 .12em; margin-left: .04em; }
  .bigop { display: inline-block; vertical-align: middle; text-align: center; line-height: 1; margin: 0 .12em; }
  .bigop .lmup, .bigop .lmdn { display: block; font-size: 55%; line-height: 1.15; }
  .bigop .lmsym { display: block; font-size: 145%; line-height: 1; }
  .intop { display: inline-block; vertical-align: middle; }
  .intlim { display: inline-block; vertical-align: -.5em; font-size: 55%; line-height: 1.1; text-align: left; }
  .intlim .lmup, .intlim .lmdn { display: block; }
  .limop { display: inline-block; vertical-align: middle; text-align: center; line-height: 1.1; margin: 0 .1em; }
  .limop .lmsub { display: block; font-size: 55%; }
  .fn { font-style: normal; }
  .imath { display: inline-block; vertical-align: -0.18em; margin: 0 .06em; }
  .unknown { color: #E23C6E; text-decoration: underline wavy; }
  .rm { font-style: normal; }
  .thin { display: inline-block; width: .18em; }
  .sp { display: inline-block; width: .55em; }
  .xarr { display: inline-flex; flex-direction: column; align-items: center; vertical-align: middle; line-height: 1.05; margin: 0 .12em; }
  .xlab { font-size: .58em; }
  .sp2 { width: 1.1em; }
  .ovl { border-top: 1.2px solid currentColor; padding-top: .06em; }
  .unl { border-bottom: 1.2px solid currentColor; padding-bottom: .06em; }
  .hat, .tld, .vec, .dot { position: relative; display: inline-block; padding-top: .12em; }
  .hat::before { content: "ˆ"; position: absolute; top: -.18em; left: 50%; transform: translateX(-50%); font-size: .9em; }
  .tld::before { content: "˜"; position: absolute; top: -.14em; left: 50%; transform: translateX(-50%); }
  .vec::before { content: "→"; position: absolute; top: -.3em; left: 50%; transform: translateX(-50%); font-size: .62em; }
  .dot::before { content: "·"; position: absolute; top: -.26em; left: 50%; transform: translateX(-50%); }
  .binom { display: inline-flex; flex-direction: column; vertical-align: middle; text-align: center;
    font-size: .82em; line-height: 1.15; padding: 0 .42em; position: relative; margin: 0 .1em; }
  .binom::before, .binom::after { position: absolute; top: 50%; transform: translateY(-50%);
    font-size: 2.1em; line-height: 1; font-weight: 200; }
  .binom::before { content: "("; left: -.14em; }
  .binom::after { content: ")"; right: -.14em; }
  .cases { display: inline-flex; align-items: center; vertical-align: middle; text-align: left; }
  .cases::before { content: "{"; font-size: 2.3em; line-height: 1; font-weight: 250;
    transform: scaleX(.72); margin-right: .34em; }
  .cases-body { display: flex; flex-direction: column; gap: .1em; }
  .case-row { display: flex; align-items: baseline; gap: .5em; white-space: nowrap; }
  .case-c { font-size: .8em; color: #5a5f78; }

  .notes { background: #fafaff; border: 1px solid #EFE9FF; border-radius: 14px; padding: 12px 16px; margin-top: 14px; }
  .notes p { margin: 6px 0; font-size: 14px; color: #4a4f66; line-height: 1.65; }
  .notes b { color: #6C4DFF; font-weight: 600; margin-right: 8px; font-size: 13px; }

  .grade { display: flex; gap: 10px; margin-top: 18px; }
  .grade .g { flex: 1; padding: 14px 0; border-radius: 13px; font-weight: 600; font-size: 15px; }
  .g0 { background: #FFE8F1; color: #E23C6E; }
  .g1 { background: #FFF4DF; color: #B4780A; }
  .g2 { background: #E5F8EE; color: #149A5C; }

  /* ---------- 拼公式 / 找错 ---------- */
  .formula.chips { display: flex; font-size: 17.5px; flex-wrap: wrap; justify-content: center; align-items: center; gap: 2px; }
  .chunk {
    display: inline-block; padding: 8px 10px; margin: 3px; max-width: 100%; border-radius: 10px;
    background: #fff; border: 1.5px solid #EBE4FB; cursor: pointer; font-size: 18px;
  }
  .chunk.right { border-color: #149A5C; background: #E5F8EE; }
  /* \quad 这类纯排版块在"找错"里画成一条细分隔线，不可点 */
  .fspace { display: inline-block; width: 1px; height: 26px; margin: 0 9px;
    background: #DCD3F5; vertical-align: middle; }
  .chunk.wrong { border-color: #E23C6E; background: #FFE8F1; }

  .slot {
    min-height: 74px; border: 1.5px dashed #c9cde4; border-radius: 14px;
    padding: 10px 12px; margin: 6px 0 14px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center;
    font-family: Georgia, "Times New Roman", "Songti SC", serif; font-size: 21px;
  }
  .slot.empty { color: #b3b7cc; font-size: 14px; font-family: inherit; }
  .bank { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
  .tok {
    max-width: 100%; padding: 9px 12px; border-radius: 11px; background: #F3EEFF;
    border: 1.5px solid #EBE4FB; cursor: pointer;
    font-family: Georgia, "Times New Roman", "Songti SC", serif; font-size: 19px;
  }
  .tok.in { background: #EFE9FF; border-color: #b9c0ff; }
  .tok.in:hover { opacity: .7; }

  .fb { text-align: center; font-weight: 700; font-size: 19px; padding: 14px 0 2px; }
  .fb.ok { color: #149A5C; }
  .fb.no { color: #E23C6E; }
  .correct { margin-top: 8px; }
  .correct > span { display: block; font-size: 12px; color: #7A7396; text-align: center; }

  /* ---------- 完成页 ---------- */
  #done { text-align: center; padding-top: 70px; }
  #done .big { font-size: 64px; font-weight: 800; color: #6C4DFF; line-height: 1; }
  #done p { color: #4a4f66; margin: 10px 0 0; }
  #done .sub { color: #7A7396; font-size: 13px; margin-top: 14px; }

  /* ---------- v0.3 新增：紫白主题组件 ---------- */
  .secondary {
    display: block; width: 100%; padding: 13px; border-radius: 14px; margin-top: 10px;
    background: #fff; color: #6C4DFF; font-weight: 600; font-size: 15px;
    border: 1.5px solid #D9CDFF;
  }
  .secondary:active { background: #F7F3FF; }
  .secondary small { display: block; font-weight: 400; font-size: 12px; color: #A79CC9; margin-top: 2px; }

  .opts { display: flex; flex-direction: column; gap: 10px; margin-top: 16px; }
  .opt {
    width: 100%; text-align: center; padding: 11px 12px; border-radius: 14px; background: #fff;
    border: 1.5px solid #EBE4FB; font-size: 18px; line-height: 1.7; color: #1B1533;
    font-family: Georgia, "Times New Roman", "Songti SC", serif; overflow-x: auto;
    transition: border-color .15s, background .15s;
  }
  .opt:active { background: #F7F3FF; }
  .opt.right { border-color: #149A5C; background: #E5F8EE; }
  .opt.wrong { border-color: #E23C6E; background: #FFE8F1; }

  .qmark { display: inline-block; min-width: 34px; text-align: center; font-weight: 700;
    font-size: 22px; color: #7C5CFF; }
  .blank {
    display: inline-block; min-width: 74px; padding: 2px 14px; margin-left: 6px;
    border-bottom: 2.5px dashed #B9A6F5; color: #B9A6F5; font-size: 20px;
  }
  .hint.flash { color: #6C4DFF; font-weight: 600; }

  /* ---------- 首页双按钮 ---------- */
  .row2 { display: flex; gap: 10px; }
  .row2 .secondary { flex: 1; padding: 14px 8px; }

  /* ---------- 总结页 ---------- */
  .segs { display: flex; gap: 8px; margin: 12px 0 16px; }
  .seg {
    flex: 1; border: 1.5px solid #E6DDFB; background: #fff; border-radius: 13px;
    padding: 10px 6px; font-size: 14px; color: #55496F; font-family: inherit; cursor: pointer;
    transition: .15s;
  }
  .seg b { font-size: 16px; margin-left: 2px; }
  .seg.on.g2 { border-color: #2f9e5f; color: #1f7a46; background: #eaf7ef; }
  .seg.on.g1 { border-color: #d99000; color: #a86e00; background: #fff6e5; }
  .seg.on.g0 { border-color: #e0526a; color: #c23a52; background: #ffeef0; }
  .sumcard {
    background: #fff; border: 1.5px solid #EDE6FC; border-radius: 18px;
    padding: 14px 14px 4px; margin-bottom: 12px;
  }
  .sumcard .sumhead { font-size: 12px; color: #7A7396; letter-spacing: .3px; }
  .sumcard h3 { font-size: 18px; margin: 4px 0 8px; color: #1B1533; }
  .sumcard .formula { font-size: 19px; padding: 12px 0 6px; }
  .sumcard .notes { font-size: 13px; padding: 8px 2px 10px; }
  .credit {
    margin-top: auto; padding: 26px 0 6px; text-align: center;
    font-size: 11.5px; line-height: 1.9; color: #A79FC0; letter-spacing: .2px;
  }
  .empty-note { text-align: center; color: #8F86A8; font-size: 14px; padding: 40px 0; }

</style>
</head>
<body>
<div id="app">

  <section id="home" class="screen">
    <div class="brand">攻<span>势</span></div>
    <div class="sub">对数学公式发起攻势</div>
    <div class="exam-row" id="examRow"></div>
    <div class="stats">
      <div><b id="stNew">0</b><span>待学</span></div>
      <div><b id="stDue">0</b><span>待复习</span></div>
      <div><b id="stDone">0</b><span>已掌握</span></div>
    </div>
    <button id="startBtn" class="primary">开始今天的学习</button>
    <div class="row2">
      <button id="reviewBtn" class="secondary">复习挑战<small>只做题</small></button>
      <button id="sumBtn" class="secondary">公式总结<small>会了 / 模糊 / 不会</small></button>
    </div>
    <div class="hint" id="homeHint"></div>
    <div class="credit">我是 mxr　这是基于 dsh 的考研数学公式记忆网站 qwq<br>感谢 wjm 的 idea！<br>祝折桂探杏，金榜题名</div>
  </section>

  <section id="study" class="screen hidden">
    <div class="topbar">
      <button id="quitBtn" class="ghost">退出</button>
      <div class="bar"><i id="barFill"></i></div>
      <div class="counter" id="counter">0/0</div>
    </div>
    <div id="card"></div>
  </section>

  <section id="summary" class="screen hidden">
    <div class="topbar">
      <button id="sumBack" class="ghost">返回</button>
      <div class="counter">总结</div>
    </div>
    <h1 class="qname">公式总结</h1>
    <div class="ask" id="sumAsk"></div>
    <div class="segs" id="sumSegs"></div>
    <div id="sumList"></div>
  </section>

  <section id="done" class="screen hidden">
    <div id="doneBody"></div>
    <button id="againBtn" class="primary">回到首页</button>
  </section>

</div>

<script>
/* 极简 LaTeX -> HTML 渲染器
   只覆盖考研公式需要的子集，不依赖任何外部库，也不需要 DOM。
   支持：\frac \sqrt ^ _ \int \iint \sum \prod \lim \left \right \text \mathrm
        \overline \bar \hat \vec \binom \begin{cases} \quad
        常用希腊字母、运算符、关系符 */
(function (global) {
  var SYM = {
    alpha: 'α', beta: 'β', gamma: 'γ', Gamma: 'Γ', delta: 'δ', Delta: 'Δ',
    epsilon: 'ε', varepsilon: 'ε', '{': '{', '}': '}', '|': '‖', 'downarrow': '↓', 'uparrow': '↑', zeta: 'ζ', eta: 'η', theta: 'θ', Theta: 'Θ',
    iota: 'ι', kappa: 'κ', lambda: 'λ', Lambda: 'Λ', mu: 'μ', nu: 'ν',
    xi: 'ξ', Xi: 'Ξ', pi: 'π', Pi: 'Π', rho: 'ρ', sigma: 'σ', Sigma: 'Σ',
    tau: 'τ', upsilon: 'υ', phi: 'φ', varphi: 'φ', Phi: 'Φ', chi: 'χ',
    psi: 'ψ', Psi: 'Ψ', omega: 'ω', Omega: 'Ω',
    infty: '∞', to: '→', rightarrow: '→', longrightarrow: '⟶', Rightarrow: '⇒', Leftarrow: '⇐', Longleftarrow: '⟸',
    leftrightarrow: '↔', Leftrightarrow: '⇔', implies: '⟹', iff: '⟺',
    cdots: '⋯', ldots: '…', dots: '…', vdots: '⋮', ddots: '⋱',
    cdot: '·', times: '×', div: '÷', ast: '∗', circ: '∘', star: '⋆',
    pm: '±', mp: '∓', le: '≤', leq: '≤', ge: '≥', geq: '≥',
    ne: '≠', neq: '≠', approx: '≈', equiv: '≡', sim: '∼', propto: '∝',
    in: '∈', notin: '∉', subset: '⊂', subseteq: '⊆', supset: '⊃',
    cup: '∪', cap: '∩', emptyset: '∅', varnothing: '∅', complement: '∁',
    forall: '∀', exists: '∃', partial: '∂', nabla: '∇', prime: '′',
    angle: '∠', perp: '⊥', parallel: '∥', triangle: '△', square: '□',
    degree: '°', oplus: '⊕', otimes: '⊗', because: '∵', therefore: '∴', simeq: '≃', cong: '≅',
    mid: '|', vert: '|', Vert: '‖', lvert: '|', rvert: '|',
    lVert: '‖', rVert: '‖', langle: '⟨', rangle: '⟩'
  };

  var FUNCS = ['ln', 'log', 'lg', 'sin', 'cos', 'tan', 'cot', 'sec', 'csc',
    'arcsin', 'arccos', 'arctan', 'arccot', 'sinh', 'cosh', 'tanh',
    'exp', 'max', 'min', 'sup', 'inf', 'det', 'gcd', 'dim', 'rank',
    'deg', 'arg', 'sgn', 'lim'];

  var BIG = { sum: '∑', prod: '∏', int: '∫', iint: '∬', iiint: '∭', oint: '∮', oiint: '∯' };

  var BAR = { overline: 'ovl', bar: 'ovl', underline: 'unl',
    hat: 'hat', widehat: 'hat', tilde: 'tld', widetilde: 'tld',
    vec: 'vec', dot: 'dot', ddot: 'ddot' };

  function esc(s) {
    return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  /* 读取一个参数：{...} / \macro / 单个字符 */
  function readArg(s, i) {
    if (i >= s.length) return ['', i];
    if (s[i] === '{') {
      var depth = 1, j = i + 1;
      while (j < s.length && depth > 0) {
        if (s[j] === '{') depth++;
        else if (s[j] === '}') depth--;
        j++;
      }
      return [s.slice(i + 1, j - 1), j];
    }
    if (s[i] === '\\') {
      var k = i + 1;
      while (k < s.length && /[a-zA-Z]/.test(s[k])) k++;
      if (k === i + 1) k = i + 2;
      return [s.slice(i, k), k];
    }
    return [s.slice(i, i + 1), i + 1];
  }

  function render(s) {
    var out = '', i = 0, a, b, name, j, k;

    while (i < s.length) {
      var c = s[i];

      if (c === '\\') {
        j = i + 1;
        while (j < s.length && /[a-zA-Z]/.test(s[j])) j++;
        name = s.slice(i + 1, j);

        if (name === '') {
          var ch = s[i + 1] || '';
          if (ch === ',' || ch === ';' || ch === ':' || ch === ' ' || ch === '!') {
            out += '<span class="thin"></span>';
          } else {
            out += esc(ch);
          }
          i += 2;
          continue;
        }

        if (name === 'quad' || name === 'qquad') {
          out += name === 'quad' ? '<span class="sp"></span>' : '<span class="sp sp2"></span>';
          i = j; continue;
        }

        if (name === 'displaystyle' || name === 'textstyle' || name === 'scriptstyle' ||
            name === 'limits' || name === 'nolimits' || name === 'middle') {
          i = j; continue;
        }

        if (name === 'frac' || name === 'dfrac' || name === 'tfrac') {
          a = readArg(s, j); i = a[1];
          b = readArg(s, i); i = b[1];
          out += '<span class="frac"><span class="num">' + render(a[0]) +
                 '</span><span class="den">' + render(b[0]) + '</span></span>';
          continue;
        }

        if (name === 'binom' || name === 'dbinom' || name === 'tbinom') {
          a = readArg(s, j); i = a[1];
          b = readArg(s, i); i = b[1];
          out += '<span class="binom"><span class="bnum">' + render(a[0]) +
                 '</span><span class="bden">' + render(b[0]) + '</span></span>';
          continue;
        }

        if (name === 'sqrt') {
          a = readArg(s, j); i = a[1];
          out += '<span class="sqrt">√<span class="rad">' + render(a[0]) + '</span></span>';
          continue;
        }

        if (name === 'begin') {
          a = readArg(s, j); i = a[1];
          var env = a[0];
          var endTag = '\\end{' + env + '}';
          var ei = s.indexOf(endTag, i);
          var body = ei < 0 ? s.slice(i) : s.slice(i, ei);
          i = ei < 0 ? s.length : ei + endTag.length;
          if (env === 'cases') {
            out += '<span class="cases"><span class="cases-body">' +
              body.split('\\\\').map(function (row) {
                var parts = row.split('&');
                return '<span class="case-row"><span class="case-v">' + render(parts[0]) +
                  '</span><span class="case-c">' + (parts[1] ? render(parts[1]) : '') +
                  '</span></span>';
              }).join('') + '</span></span>';
          } else {
            out += render(body);
          }
          continue;
        }

        if (name === 'end') {
          a = readArg(s, j); i = a[1]; continue;
        }

        if (name === 'text' || name === 'mathrm' || name === 'operatorname' ||
            name === 'mathbf' || name === 'textbf' || name === 'mbox') {
          a = readArg(s, j); i = a[1];
          out += '<span class="rm">' + esc(a[0].replace(/\\/g, '')) + '</span>';
          continue;
        }

        if (BAR[name] !== undefined) {
          a = readArg(s, j); i = a[1];

     learn  认脸：看名字想公式，翻面自评（新卡专用，"记忆考察"）
     choice 选择：给名字，从 4 个式子里挑（干扰项取自同章节/同模块的易混公式）
     fill   挖空：给定等号左边，把右边拼回来
     build  拼公式：整条公式打乱顺序拼回去（复习里暂时不出，代码保留）
     find   找错：公式被改了一处，点出错误
   复习调度：Leitner 五盒（interval 0/1/3/7/15 天） */

(function () {
  var KEY = 'gongshi_v1';
  var EXAMS = ['数一', '数二', '数三', '396'];

  S.exam = S.exam || '数三';
  S.streak = S.streak || 0;
  S.lastDay = S.lastDay || '';
  S.today = S.today || { day: '', n: 0 };
  S.mark = S.mark || {};          // 最近一次自评：2 会了 / 1 模糊 / 0 不会

  var session = [], idx = 0, cur = null, sessionKind = 'daily';

  /* ---------- 存储与日期 ---------- */
  function load() {
    try { var o = JSON.parse(localStorage.getItem(KEY)); return (o && typeof o === 'object') ? o : {}; }
    catch (e) { return {}; }
  }
  function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }
  function dayKey(d) {
    d = d || new Date();
    return d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate();
  }
  function shuffle(a) {
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  /* ---------- 数据筛选 ---------- */
  function pool() {
    return FORMULAS.filter(function (f) { return f.tags.indexOf(S.exam) >= 0; });
  }
  function studiedPool() {
    return pool().filter(function (f) {
      return S.mark[f.id] !== undefined || (S.box[f.id] || 0) > 0;
    }).sort(function (a, b) { return (S.due[a.id] || 0) - (S.due[b.id] || 0); });
  }
  function counts() {
    var p = pool();
    var nw = 0, due = 0, done = 0;
    p.forEach(function (f) {
      var b = S.box[f.id] || 0;
      var seen = S.mark[f.id] !== undefined || b > 0;
      if (!seen) nw++;
      else due++;          // 评过级就算"待复习"，和「复习挑战」的池子一致
      if (b >= 3) done++;
    });
    return { nw: nw, due: due, done: done, total: p.length };
  }

  /* ---------- 出题 ---------- */
  var SEPS = ['=', '~', '\\approx', '\\sim'];
  function splitAtEq(chunks) {
    var i = -1;
    for (var k = 0; k < chunks.length; k++) {
      if (SEPS.indexOf(chunks[k]) >= 0) { i = k; break; }
    }
    if (i <= 0 || i >= chunks.length - 1) return null;
    return { left: chunks.slice(0, i + 1), right: chunks.slice(i + 1) };
  }

  // 找错题不能把式子写在标题里，否则一眼就看出来了。
  // 名字形如「等价无穷小：tan x - x」，只取冒号前那段。
  function shortName(f) {
    var i = f.name.search(/[：:]/);
    if (i <= 0) return f.name;
    return f.name.slice(0, i);
  }

  // \quad 这种纯排版块不该出现在"点哪块错了"里，也不该当选项
  function isSpacer(c) {
    return /^\\(quad|qquad|,|;|:|!| )$/.test(c) || /^\\[,;:!]?$/.test(c);
  }

  function pickMode(f, quizOnly) {
    var n = f.chunks.length, eq = splitAtEq(f.chunks);
    var w = [];
    if (!quizOnly) w.push(['learn', 2]);
    // 只要等号右边有内容块就能出选填（极限题就是「左边已知、右边挖空」）
    var canBlank = !!eq && eq.right.some(function (c) {
      return c.length > 1 && /[A-Za-z\\]/.test(c) && !isSpacer(c);
    });
    if (canBlank) w.push(['blank', 3]);
    w.push(['choice', 2]);
    if (eq && eq.right.length >= 2) w.push(['fill', 3]);
    // 极限、导数这两章的找错题太容易（改个符号就能看出），先不出
    if (f.trap && n >= 3 && f.chapter !== '极限' && f.chapter !== '导数') w.push(['find', 2]);
    var total = 0;
    w.forEach(function (x) { total += x[1]; });
    var r = Math.random() * total;
    for (var i = 0; i < w.length; i++) { r -= w[i][1]; if (r <= 0) return w[i][0]; }
    return 'learn';
  }

  function startSession(kind) {
    sessionKind = kind === 'review' ? 'review' : 'daily';
    var now = Date.now(), p = pool();
    var dues = p.filter(function (f) { return (S.box[f.id] || 0) > 0 && (S.due[f.id] || 0) <= now; });
    var news = p.filter(function (f) { return !S.box[f.id]; });
    dues = shuffle(dues.slice(0, 15));
    news = news.slice(0, 8);

    if (kind === 'review') {
      // 复习挑战：只要在学习里评过级（会了/模糊/不会）就能进来，不等间隔到期
      var stu = studiedPool();
      if (!stu.length) { flash('还没有评过级的公式，先学几张新卡吧'); return; }
      var pick = shuffle(stu.slice(0, 15));
      session = pick.map(function (f) { return { f: f, mode: pickMode(f, true) }; });
    } else {
      // 先"记忆考察"新卡（learn），再做到期卡的题
      session = news.map(function (f) { return { f: f, mode: 'learn' }; })
        .concat(dues.map(function (f) { return { f: f, mode: pickMode(f, false) }; }));
      if (!session.length) { flash('这个考试方向已经刷完了 🎉'); return; }
    }
    idx = 0;
    show('study');
    renderCard();
  }

  function flash(msg) {
    var h = document.getElementById('homeHint');
    h.textContent = msg;
    h.classList.add('flash');
    setTimeout(function () { h.classList.remove('flash'); }, 1600);
  }

  /* ---------- 渲染 ---------- */
  function show(id) {
    ['home', 'study', 'summary', 'done'].forEach(function (s) {
      document.getElementById(s).classList.toggle('hidden', s !== id);
    });
  }

  function formulaBox(f) {
    var t = texHTML(f.chunks.join(' '));
    if (f.cond) t += '<span class="cond">' + texHTML(f.cond) + '</span>';
    return '<div class="formula">' + t + '</div>';
  }
  function notes(f) {
    return '<div class="notes">' +
      '<p><b>口诀</b>' + richText(f.hook) + '</p>' +
      '<p><b>易错</b>' + richText(f.pitfall) + '</p>' +
      '<p><b>辨析</b>' + richText(f.similar) + '</p>' +
      '</div>';
  }
  function gradeBtns() {
    return '<div class="grade">' +
      '<button class="g g0" data-act="grade" data-g="0">忘了</button>' +
      '<button class="g g1" data-act="grade" data-g="1">模糊</button>' +
      '<button class="g g2" data-act="grade" data-g="2">会了</button>' +
      '</div>';
  }
  function nextBtn() {
    return '<button class="primary" data-act="next">下一个</button>';
  }
  function feedback(f, ok) {
    var tip = ok ? '对了' : '再记一次';
    var html = '<div class="fb ' + (ok ? 'ok' : 'no') + '">' + tip + '</div>' +
      '<div class="correct"><span>正确写法</span>' + formulaBox(f) + '</div>';
    if (ok) html += notes(f);
    return html + nextBtn();
  }

  function learnHTML(f) {
    var html = '<div class="tagline">' + f.module + ' · ' + f.chapter + '</div>' +
      '<h1 class="qname">' + f.name + '</h1>';
    if (!cur.revealed) {
      html += '<div class="ask">先在脑子里过一遍它的样子，再点开对照</div>' +
        '<button class="primary" data-act="reveal">显示公式</button>';
    } else {
      html += formulaBox(f) + notes(f) + gradeBtns();
    }
    return html;
  }

  function findHTML(f) {
    var chips = f.chunks.map(function (c, i) {
      if (i !== f.trap.i && isSpacer(c)) return '<span class="fspace"></span>';
      var text = (i === f.trap.i) ? f.trap.t : c;
      var cls = 'chunk';
      if (cur.result !== null && i === f.trap.i) cls += ' right';
      if (cur.result !== null && i === cur.picked && !cur.result) cls += ' wrong';
      return '<span class="' + cls + '" data-act="pick" data-i="' + i + '">' + texHTML(text) + '</span>';
    }).join('');
    var html = '<div class="tagline">找错 · ' + f.module + ' · ' + f.chapter + '</div>' +
      '<h1 class="qname">' + shortName(f) + '</h1>' +
      '<div class="ask">下面这条公式错了一处，点出错误的那一块</div>' +
      '<div class="formula chips">' + chips + '</div>';
    if (cur.result !== null) html += feedback(f, cur.result);
    return html;
  }

  function buildHTML(f) {
    var chosen = cur.chosen;
    var slot = chosen.map(function (i) {
      return '<span class="tok in" data-act="untok" data-i="' + i + '">' + texHTML(f.chunks[i]) + '</span>';
    }).join('');
    var bank = cur.order.filter(function (i) { return chosen.indexOf(i) < 0; }).map(function (i) {
      return '<span class="tok" data-act="tok" data-i="' + i + '">' + texHTML(f.chunks[i]) + '</span>';
    }).join('');
    var html = '<div class="tagline">拼公式 · ' + f.module + '</div>' +
      '<h1 class="qname">' + f.name + '</h1>' +
      '<div class="ask">按顺序点选，把公式拼出来</div>' +
      '<div class="slot' + (chosen.length ? '' : ' empty') + '">' +
      (slot || '点下面的积木块开始拼') + '</div>' +
      '<div class="bank">' + bank + '</div>';
    if (cur.result === null) {
      html += '<button class="primary" data-act="submit"' +
        (chosen.length === f.chunks.length ? '' : ' disabled') + '>提交</button>';
    } else {
      html += feedback(f, cur.result);
    }
    return html;
  }

  /* 干扰项：优先同一章（最容易混），再同模块，最后全库 */
  function decoys(f, k) {
    var p = pool();
    function pick(filter) { return shuffle(p.filter(filter)); }
    var same = pick(function (x) { return x.id !== f.id && x.chapter === f.chapter; });
    var mod = pick(function (x) { return x.id !== f.id && x.module === f.module && x.chapter !== f.chapter; });
    var rest = pick(function (x) { return x.id !== f.id && x.module !== f.module; });
    var cand = same.concat(mod, rest), out = [], seen = {};
    seen[f.chunks.join(' ')] = 1;
    for (var i = 0; i < cand.length && out.length < k; i++) {
      var key = cand[i].chunks.join(' ');
      if (seen[key]) continue;
      seen[key] = 1; out.push(cand[i]);
    }
    return out;
  }

  function choiceHTML(f) {
    if (!cur.opts) {
      var eq = splitAtEq(f.chunks);
      var right = eq ? eq.right.join(' ') : f.chunks.join(' ');
      var seen = {}; seen[right] = 1;
      var items = [{ t: right, ok: true }];
      var near = shuffle(pool().filter(function (x) { return x.id !== f.id && x.chapter === f.chapter; }));
      var far = shuffle(pool().filter(function (x) { return x.id !== f.id && x.chapter !== f.chapter; }));
      near.concat(far).forEach(function (x) {
        if (items.length >= 4) return;
        var e2 = splitAtEq(x.chunks);
        var r = e2 ? e2.right.join(' ') : x.chunks.join(' ');
        if (seen[r]) return;
        seen[r] = 1; items.push({ t: r, ok: false });
      });
      cur.opts = shuffle(items);
      cur.stem = eq ? eq.left.join(' ') : '';
    }
    var html = '<div class="tagline">选择题 · ' + f.module + ' · ' + f.chapter + '</div>' +
      '<h1 class="qname">' + shortName(f) + '</h1>' +
      '<div class="ask">它的结果是哪一个？</div>' +
      '<div class="formula">' + texHTML(cur.stem) +
        (cur.stem ? ' <span class="qmark">?</span>' : '') + '</div>' +
      '<div class="opts">';
    cur.opts.forEach(function (o, i) {
      var cls = 'opt';
      if (cur.result !== null) {
        if (o.ok) cls += ' right';
        else if (i === cur.picked) cls += ' wrong';
      }
      html += '<button class="' + cls + '" data-act="choose" data-i="' + i + '">' +
        texHTML(o.t) + '</button>';
    });
    html += '</div>';
    if (cur.result !== null) html += feedback(f, cur.result);
    return html;
  }

  function fillHTML(f) {
    var eq = splitAtEq(f.chunks), right = eq.right;
    if (!cur.rightOrder) cur.rightOrder = shuffle(right.map(function (_, i) { return i; }));
    var chosen = cur.chosen;
    var slot = chosen.map(function (i) {
      return '<span class="tok in" data-act="untok" data-i="' + i + '">' + texHTML(right[i]) + '</span>';
    }).join('');
    var bank = cur.rightOrder.filter(function (i) { return chosen.indexOf(i) < 0; })
      .map(function (i) {
        return '<span class="tok" data-act="tok" data-i="' + i + '">' + texHTML(right[i]) + '</span>';
      }).join('');
    var html = '<div class="tagline">挖空拼公式 · ' + f.module + ' · ' + f.chapter + '</div>' +
      '<h1 class="qname">' + f.name + '</h1>' +
      '<div class="ask">左边已经给定了，把右边补回来</div>' +
      '<div class="formula">' + texHTML(eq.left.join(' ')) + '<span class="blank">?</span></div>' +
      '<div class="slot' + (chosen.length ? '' : ' empty') + '">' +
      (slot || '点下面的积木块补上等式右边') + '</div>' +
      '<div class="bank">' + bank + '</div>';
    if (cur.result === null) {
      html += '<button class="primary" data-act="submit"' +
        (chosen.length === right.length ? '' : ' disabled') + '>提交</button>';
    } else {
      html += feedback(f, cur.result);
    }
    return html;
  }

  /* 选填：把公式里一块挖掉，从 4 个候选块里挑（任何公式都能出，不依赖等号） */
  function blankHTML(f) {
    if (!cur.opts) {
      // 等号前面一律当已知（极限题尤其明显），只在右边挖
      var eq = splitAtEq(f.chunks);
      var from = eq ? f.chunks.length - eq.right.length : 0;
      var cand = [];
      f.chunks.forEach(function (c, i) {
        if (i < from || c.length < 2 || !/[A-Za-z\\]/.test(c) || isSpacer(c)) return;
        cand.push(i);
      });
      cur.blankAt = cand.length ? cand[Math.floor(Math.random() * cand.length)] : 0;
      var texts = [], seen = {};
      seen[f.chunks[cur.blankAt]] = 1;
      var near = shuffle(pool().filter(function (x) { return x.id !== f.id && x.chapter === f.chapter; }));
      var far = shuffle(pool().filter(function (x) { return x.id !== f.id && x.chapter !== f.chapter; }));
      near.concat(far).forEach(function (x) {
        x.chunks.forEach(function (c) {
          if (texts.length >= 3 || seen[c]) return;
          if (c.length < 2 || !/[A-Za-z\\]/.test(c) || isSpacer(c)) return;  // 不拿 = ~ \quad 这种块当干扰项
          seen[c] = 1; texts.push(c);
        });
      });
      cur.opts = shuffle([{ t: f.chunks[cur.blankAt], ok: true }]
        .concat(texts.map(function (t) { return { t: t, ok: false }; })));
    }
    var body = f.chunks.map(function (c, i) {
      return i === cur.blankAt ? '<span class="blank">?</span>' : texHTML(c);
    }).join(' ');
    var html = '<div class="tagline">选填 · ' + f.module + ' · ' + f.chapter + '</div>' +
      '<h1 class="qname">' + f.name + '</h1>' +
      '<div class="ask">空格里该填哪一块？</div>' +
      '<div class="formula">' + body + '</div><div class="opts">';
    cur.opts.forEach(function (o, i) {
      var cls = 'opt';
      if (cur.result !== null) {
        if (o.ok) cls += ' right';
        else if (i === cur.picked) cls += ' wrong';
      }
      html += '<button class="' + cls + '" data-act="choose" data-i="' + i + '">' + texHTML(o.t) + '</button>';
    });
    html += '</div>';
    if (cur.result !== null) html += feedback(f, cur.result);
    return html;
  }

  function renderCard() {
    if (idx >= session.length) { finish(); return; }
    var it = session[idx];
    cur = {
      it: it, revealed: false, chosen: [], result: null, picked: -1,
      order: shuffle(it.f.chunks.map(function (_, i) { return i; })),
      rightOrder: null, opts: null, blankAt: null
    };
    document.getElementById('counter').textContent = (idx + 1) + '/' + session.length;
    document.getElementById('barFill').style.width = (idx / session.length * 100) + '%';
    drawCard();
    window.scrollTo(0, 0);
  }
  function drawCard() {
    var f = cur.it.f;
    var el = document.getElementById('card');
    if (cur.it.mode === 'learn') el.innerHTML = learnHTML(f);
    else if (cur.it.mode === 'find') el.innerHTML = findHTML(f);
    else if (cur.it.mode === 'choice') el.innerHTML = choiceHTML(f);
    else if (cur.it.mode === 'fill') el.innerHTML = fillHTML(f);
    else if (cur.it.mode === 'blank') el.innerHTML = blankHTML(f);
    else el.innerHTML = buildHTML(f);
  }

  /* ---------- 判分与调度 ---------- */
  function applyGrade(f, g) {
    var b = S.box[f.id] || 0, nb;
    if (g === 2) nb = Math.min(b + 1, 4);
    else if (g === 1) nb = Math.max(b, 1);
    else nb = 0;
    S.box[f.id] = nb;
    S.mark[f.id] = g;
    S.due[f.id] = Date.now() + INTERVALS[nb] * 86400000;
    S.history = S.history || {};
    S.history[f.id] = (S.history[f.id] || 0) + 1;
    save();
  }

  /* ---------- 事件 ---------- */
  function onClick(e) {
    var t = e.target.closest ? e.target.closest('[data-act]') : null;
    if (!t) return;
    var act = t.getAttribute('data-act');
    var f = cur && cur.it.f;

    if (act === 'reveal') { cur.revealed = true; drawCard(); return; }

    if (act === 'grade') {
      applyGrade(f, parseInt(t.getAttribute('data-g'), 10));
      bumpToday(); idx++; renderCard(); return;
    }

    if (act === 'choose') {
      if (cur.result !== null) return;
      var ci = parseInt(t.getAttribute('data-i'), 10);
      cur.picked = ci;
      cur.result = !!cur.opts[ci].ok;
      applyGrade(f, cur.result ? 2 : 0);
      bumpToday();
      drawCard(); return;
    }

    if (act === 'pick') {
      if (cur.result !== null) return;
      var i = parseInt(t.getAttribute('data-i'), 10);
      cur.picked = i;
      cur.result = (i === f.trap.i);
      applyGrade(f, cur.result ? 2 : 0);
      bumpToday();
      drawCard(); return;
    }

    if (act === 'tok') {
      cur.chosen.push(parseInt(t.getAttribute('data-i'), 10));
      drawCard(); return;
    }
    if (act === 'untok') {
      var k = cur.chosen.indexOf(parseInt(t.getAttribute('data-i'), 10));
      if (k >= 0) cur.chosen.splice(k, 1);
      drawCard(); return;
    }
    if (act === 'submit') {
      if (cur.result !== null) return;
      var target = cur.it.mode === 'fill' ? splitAtEq(f.chunks).right.length : f.chunks.length;
      var ok = cur.chosen.length === target &&
        cur.chosen.every(function (v, n) { return v === n; });
      cur.result = ok;
      applyGrade(f, ok ? 2 : 0);
      bumpToday();
      drawCard(); return;
    }
    if (act === 'next') { idx++; renderCard(); return; }
  }

  function bumpToday() {
    var d = dayKey();
    if (S.today.day !== d) { S.today = { day: d, n: 0 }; }
    S.today.n++;
    save();
  }

  /* ---------- 首页 / 完成页 ---------- */
  function renderHome() {
    var c = counts();
    document.getElementById('stNew').textContent = c.nw;
    document.getElementById('stDue').textContent = c.due;
    document.getElementById('stDone').textContent = c.done;
    document.getElementById('homeHint').textContent =
      '题库共 ' + c.total + ' 条 · 今日已刷 ' + (S.today.day === dayKey() ? S.today.n : 0) +
      ' 题 · 连续 ' + S.streak + ' 天';
    var row = document.getElementById('examRow');
    row.innerHTML = EXAMS.map(function (x) {
      return '<button class="chip' + (x === S.exam ? ' on' : '') + '" data-exam="' + x + '">' + x + '</button>';
    }).join('');
  }

  var sumGroup = 2;
  function renderSummary() {
    var p = pool(), g = { '0': [], '1': [], '2': [] }, un = 0;
    p.forEach(function (f) {
      if (S.mark[f.id] === undefined && !(S.box[f.id] || 0)) { un++; return; }
      var m = S.mark[f.id] === undefined ? 2 : S.mark[f.id];
      g[m].push(f);
    });
    document.getElementById('sumAsk').textContent =
      '共 ' + p.length + ' 条，其中未学 ' + un + ' 条。点上面三档看对应的公式。';
    document.getElementById('sumSegs').innerHTML = [
      ['2', '会了', 'g2'], ['1', '模糊', 'g1'], ['0', '不会', 'g0']
    ].map(function (x) {
      return '<button class="seg ' + x[2] + (String(sumGroup) === x[0] ? ' on' : '') +
        '" data-g="' + x[0] + '">' + x[1] + ' <b>' + g[x[0]].length + '</b></button>';
    }).join('');

    var list = g[sumGroup];
    if (!list.length) {
      document.getElementById('sumList').innerHTML =
        '<div class="empty-note">这一档还没有公式。</div>';
      return;
    }
    document.getElementById('sumList').innerHTML = list.map(function (f) {
      return '<div class="sumcard">' +
        '<div class="sumhead">' + f.module + ' · ' + f.chapter + '</div>' +
        '<h3>' + f.name + '</h3>' + formulaBox(f) + notes(f) + '</div>';
    }).join('');
  }

  function finish() {
    var d = dayKey();
    if (S.lastDay !== d) {
      var y = new Date(); y.setDate(y.getDate() - 1);
      S.streak = (S.lastDay === dayKey(y)) ? S.streak + 1 : 1;
      S.lastDay = d;
      save();
    }
    var c = counts();
    document.getElementById('doneBody').innerHTML =
      '<div class="big">' + session.length + '</div>' +
      '<p>' + (sessionKind === 'review' ? '道题刷完了' : '个公式过了一遍') + '</p>' +
      '<p class="sub">待复习 ' + c.due + ' · 已掌握 ' + c.done + ' · 连续 ' + S.streak + ' 天</p>';
    show('done');
  }

  /* ---------- 启动 ---------- */
  function init() {
    renderHome();
    document.getElementById('examRow').addEventListener('click', function (e) {
      var b = e.target.closest('[data-exam]');
      if (!b) return;
      S.exam = b.getAttribute('data-exam');
      save(); renderHome();
    });
    document.getElementById('startBtn').addEventListener('click', function () { startSession('daily'); });
    document.getElementById('reviewBtn').addEventListener('click', function () { startSession('review'); });
    document.getElementById('sumBtn').addEventListener('click', function () { renderSummary(); show('summary'); });
    document.getElementById('sumBack').addEventListener('click', function () { show('home'); renderHome(); });
    document.getElementById('sumSegs').addEventListener('click', function (e) {
      var b = e.target.closest('[data-g]');
      if (!b) return;
      sumGroup = Number(b.getAttribute('data-g'));
      renderSummary();
    });
    document.getElementById('quitBtn').addEventListener('click', function () { show('home'); renderHome(); });
    document.getElementById('againBtn').addEventListener('click', function () { show('home'); renderHome(); });
    document.getElementById('card').addEventListener('click', onClick);
  }

  document.addEventListener('DOMContentLoaded', init);
})();

</script>
</body>
</html>
